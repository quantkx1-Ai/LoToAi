name: Build Signed Android (.AAB/.APK) & iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android (.APK & .AAB cho CH Play)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Package www/
        run: |
          npm install
          npm run build
          npx cap add android || npx cap sync android

      - name: Build APK & AAB via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Generate Release Keystore & Sign AAB for Google Play Console
        working-directory: ./android
        run: |
          keytool -genkeypair -v -keystore lotoai-release.keystore -alias lotoai -keyalg RSA -keysize 2048 -validity 10000 -storepass lotoai123456 -keypass lotoai123456 -dname "CN=LotoAI Pro, OU=Mobile, O=QuantkAI, L=Hanoi, S=HN, C=VN"
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$AAB_PATH" app-release-signed.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore lotoai-release.keystore -storepass lotoai123456 -keypass lotoai123456 app-release-signed.aab lotoai

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LotoAI-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Google Play AAB & Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LotoAI-Pro-Signed-GooglePlay-AAB
          path: |
            android/app-release-signed.aab
            android/lotoai-release.keystore

  build-ios:
    name: Build iOS Project (Xcode on macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate iOS Xcode Project
        run: |
          npm install
          npm run build
          npx cap add ios || npx cap sync ios

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LotoAI-Pro-iOS-Xcode-Project
          path: ios/
